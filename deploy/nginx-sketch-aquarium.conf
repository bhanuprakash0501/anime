# nginx site for the Sketch Aquarium. Installed by deploy/install.sh to
# /etc/nginx/sites-available/sketch-aquarium. nginx serves everything static and
# proxies only the API to the Python app on 127.0.0.1:8000.

upstream sketch_aquarium_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name anime.monagadu.com _;

    root /opt/sketch_aquarium/aquarium;
    index index.html;

    access_log /var/log/nginx/sketch-aquarium.access.log;
    error_log  /var/log/nginx/sketch-aquarium.error.log;

    # photo uploads from phones
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/html;

    # pretty routes for the two app pages
    location = /scan  { try_files /scan.html =404; }
    location = /admin { try_files /admin.html =404; }

    # scanned drawings (written by the app; never cache, they are replaced often)
    location /sprites/ {
        alias /opt/sketch_aquarium/sprites/;
        add_header Cache-Control "no-store";
    }

    # dynamic: scanning, live creature list, admin actions
    location /api/ {
        proxy_pass http://sketch_aquarium_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # pass through what HAProxy tells us, default to https for the public site
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
    }

    # the 3D library and page scripts can be cached by browsers
    location /vendor/ { expires 7d; add_header Cache-Control "public"; }
    location ~* \.(js|html)$ { add_header Cache-Control "no-cache"; }

    # ---- the same app mounted under /aqua/ (pages detect their base path themselves)
    location = /aqua { return 301 /aqua/; }
    location /aqua/sprites/ {
        alias /opt/sketch_aquarium/sprites/;
        add_header Cache-Control "no-store";
    }
    location /aqua/api/ {
        rewrite ^/aqua/(.*)$ /$1 break;
        proxy_pass http://sketch_aquarium_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /aqua;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
    }
    location = /aqua/scan  { alias /opt/sketch_aquarium/aquarium/scan.html; }
    location = /aqua/admin { alias /opt/sketch_aquarium/aquarium/admin.html; }
    location /aqua/ {
        alias /opt/sketch_aquarium/aquarium/;
        index index.html;
    }

    # static pages
    location / {
        try_files $uri $uri/ =404;
    }
}
