# HAProxy: route https://anime.monagadu.com to the Sketch Aquarium container.
# Merge into the existing haproxy.cfg (the frontend that terminates TLS on :443).

frontend https_in
    # ... existing bind/ssl lines ...
    acl host_anime hdr(host) -i anime.monagadu.com
    use_backend sketch_aquarium if host_anime

backend sketch_aquarium
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    # photo uploads are a few MB; give them time
    timeout server 60s
    server anime 192.168.201.222:8000 check
